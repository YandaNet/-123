{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="text-center mb-4">Реєстрація акаунта</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100">Зареєструватися</button>
                </form>
                <div class="mt-3 text-center">
                    <a href="{% url 'login' %}">Вже маєте акаунт? Увійти</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
