{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-4">
    <div class="col-md-7">
        <div class="card shadow">
            <div class="card-body">
                <h3 class="mb-4">Створити нову заявку</h3>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-success w-100">Надіслати заявку</button>
                </form>
                <div class="mt-3 text-center">
                    <a href="{% url 'ticket_list' %}" class="btn btn-secondary btn-sm">Назад до списку</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
